name: FoodLodge
options:
  bundleIdPrefix: com.andreaverlicchi
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_LANGUAGE: en
targets:
  FoodLodge:
    type: application
    platform: iOS
    sources:
      - path: FoodLodge
        excludes:
          - "**/.DS_Store"
    info:
      path: FoodLodge/Info.plist
      properties:
        CFBundleDisplayName: Food Lodge
        CFBundleLocalizations: [en, it, es, fr, pt]
        CFBundleDevelopmentRegion: en
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: "Food Lodge uses the camera to photograph meals and estimate their nutrition."
        NSPhotoLibraryUsageDescription: "Food Lodge reads photos you pick to estimate the nutrition of a meal."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andreaverlicchi.macrolog
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: false
        ENABLE_PREVIEWS: true
  FoodLodgeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FoodLodgeTests
    dependencies:
      - target: FoodLodge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andreaverlicchi.macrolog.tests
        GENERATE_INFOPLIST_FILE: true
schemes:
  FoodLodge:
    build:
      targets:
        FoodLodge: all
        FoodLodgeTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [FoodLodgeTests]
